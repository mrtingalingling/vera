<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 608" role="img" aria-label="Vera architecture" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A9A9A"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1F1F">Verdicts are made only in the pipeline; every surface is a client</text><rect x="24" y="56" width="712" height="120" rx="8" fill="none" stroke="#9A9A9A" stroke-dasharray="4 4"/><text x="40" y="78" font-size="13" font-weight="600" fill="#1F1F1F">User device: personal data stays here</text><rect x="24" y="216" width="712" height="208" rx="8" fill="none" stroke="#9A9A9A" stroke-dasharray="4 4"/><text x="40" y="238" font-size="13" font-weight="600" fill="#1F1F1F">Vera service</text><rect x="24" y="464" width="712" height="120" rx="8" fill="none" stroke="#9A9A9A" stroke-dasharray="4 4"/><text x="40" y="486" font-size="13" font-weight="600" fill="#1F1F1F">Outside Vera</text><g fill="none" stroke="#9A9A9A" stroke-width="1.25"><path d="M256 124H270" marker-end="url(#a)"/><path d="M200 160V246" marker-end="url(#a)"/><path d="M256 284H270" marker-end="url(#a)"/><path d="M504 284H490" marker-end="url(#a)"/><path d="M380 320V334" marker-end="url(#a)"/><path d="M504 372H490" marker-end="url(#a)"/><path d="M380 408V494" marker-end="url(#a)"/><path d="M460 408V440H612V494" marker-end="url(#a)"/><path d="M148 320V494" marker-end="url(#a)"/><path d="M240 160V168H612V162" marker-end="url(#a)"/></g><text x="208" y="200" font-size="11.5" fill="#5F5F5F">scrubbed text, after preview</text><text x="156" y="376" font-size="11.5" fill="#5F5F5F">API, SDK, embeds</text><rect x="40" y="88" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="148" y="112" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Extension side panel</text><text x="148" y="128" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Highlights from offsets</text><text x="148" y="144" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Shows what will be sent</text><rect x="272" y="88" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="380" y="112" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">On-device model</text><text x="380" y="128" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Extracts claims, scrubs PII</text><text x="380" y="144" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Never issues verdicts</text><rect x="504" y="88" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="612" y="112" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Local cache</text><text x="612" y="128" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Verdicts already fetched</text><text x="612" y="144" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Offline shows cache only</text><rect x="40" y="248" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="148" y="272" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Public API /v1</text><text x="148" y="288" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Keys, quotas, webhooks</text><text x="148" y="304" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Every client calls it</text><rect x="272" y="248" width="216" height="72" rx="8" fill="#2F6FDE" fill-opacity="0.12" stroke="#2F6FDE" stroke-width="2"/><text x="380" y="272" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Verification pipeline</text><text x="380" y="288" font-size="11.5" fill="#1F1F1F" text-anchor="middle">Check, retrieve, judge,</text><text x="380" y="304" font-size="11.5" fill="#1F1F1F" text-anchor="middle">aggregate in code</text><rect x="504" y="248" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="612" y="272" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Eval harness</text><text x="612" y="288" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Gates prompt and rule</text><text x="612" y="304" font-size="11.5" fill="#5F5F5F" text-anchor="middle">changes; injection suite</text><rect x="272" y="336" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="380" y="360" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Verdict ledger</text><text x="380" y="376" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Append-only, signed, CID</text><text x="380" y="392" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Corrections are versions</text><rect x="504" y="336" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="612" y="360" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Review queue</text><text x="612" y="376" font-size="11.5" fill="#5F5F5F" text-anchor="middle">User flags and sources</text><text x="612" y="392" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Humans decide</text><rect x="40" y="496" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="148" y="520" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Partner platforms</text><text x="148" y="536" font-size="11.5" fill="#5F5F5F" text-anchor="middle">ClearCloud and others</text><text x="148" y="552" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Public API only</text><rect x="272" y="496" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="380" y="520" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">ATProto records</text><text x="380" y="536" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Public signed verdicts</text><text x="380" y="552" font-size="11.5" fill="#5F5F5F" text-anchor="middle">libp2p mirror later</text><rect x="504" y="496" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="612" y="520" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Veracities.bet</text><text x="612" y="536" font-size="11.5" fill="#5F5F5F" text-anchor="middle">API customer at published prices</text><text x="612" y="552" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Nothing flows back</text></svg>