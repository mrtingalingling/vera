<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Vera roadmap" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#FFFFFF"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1F1F1F">Vera ships in five gated phases</text><text x="24" y="52" font-size="11.5" fill="#5F5F5F">Sequenced by gates, not dates; bands are not to scale</text><text x="24" y="84" font-size="13" font-weight="600" fill="#1F1F1F">Vera</text><rect x="24" y="96" width="112" height="56" rx="8" fill="#2F6FDE" fill-opacity="0.12" stroke="#2F6FDE" stroke-width="2"/><text x="80" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Phase 0</text><text x="80" y="136" font-size="11.5" fill="#1F1F1F" text-anchor="middle">Honest baseline</text><rect x="144" y="96" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="200" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Phase 1</text><text x="200" y="136" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Verification core</text><rect x="264" y="96" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="320" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Phase 2</text><text x="320" y="136" font-size="11.5" fill="#5F5F5F" text-anchor="middle">API and SDK v1</text><rect x="384" y="96" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="440" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Phase 3</text><text x="440" y="136" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Extension v2</text><rect x="504" y="96" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25"/><text x="560" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Phase 4</text><text x="560" y="136" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Ledger, ATProto</text><rect x="624" y="96" width="112" height="56" rx="8" fill="none" fill-opacity="1" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="4 4"/><text x="680" y="120" font-size="13" font-weight="600" fill="#1F1F1F" text-anchor="middle">Later</text><text x="680" y="136" font-size="11.5" fill="#5F5F5F" text-anchor="middle">libp2p mirror</text><polygon points="130,166 140,156 150,166 140,176" fill="#2F6FDE"/><text x="140" y="196" font-size="11.5" font-weight="600" fill="#1F1F1F" text-anchor="middle">Gate 0</text><text x="140" y="212" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Docs match code</text><polygon points="250,166 260,156 270,166 260,176" fill="#2F6FDE"/><text x="260" y="196" font-size="11.5" font-weight="600" fill="#1F1F1F" text-anchor="middle">Gate 1</text><text x="260" y="212" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Eval targets met</text><polygon points="370,166 380,156 390,166 380,176" fill="#2F6FDE"/><text x="380" y="196" font-size="11.5" font-weight="600" fill="#1F1F1F" text-anchor="middle">Gate 2</text><text x="380" y="212" font-size="11.5" fill="#5F5F5F" text-anchor="middle">API v1 frozen</text><polygon points="490,166 500,156 510,166 500,176" fill="#2F6FDE"/><text x="500" y="196" font-size="11.5" font-weight="600" fill="#1F1F1F" text-anchor="middle">Gate 3</text><text x="500" y="212" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Privacy audited</text><polygon points="610,166 620,156 630,166 620,176" fill="#2F6FDE"/><text x="620" y="196" font-size="11.5" font-weight="600" fill="#1F1F1F" text-anchor="middle">Gate 4</text><text x="620" y="212" font-size="11.5" fill="#5F5F5F" text-anchor="middle">Corrections work</text></svg>
